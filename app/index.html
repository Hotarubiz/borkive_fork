const ITGUESS = {module: 'module', preset: 'preset', plugin: 'plugin'};
async function addItem(preType) {
  let picked = [], itype = ITYPE[preType] ? preType : '', typeTouched = !!itype, cov = null;
  const chosen = new Set(), fold = +ss.get('bs-ifolder');
  if (fold && itemFolders().some(f => f.id === fold)) chosen.add(fold);
  const m = modal(`<header><h2>자료 들이기</h2><span>모듈·프리셋·로어북·플러그인 파일</span>${xBtn}</header>
    <div class="bd">
      <div class="drop" id="iDrop" tabindex="0" role="button"><span style="color:var(--acc)">${ic('dl', 26, 1.6)}</span><b>파일을 끌어다 놓거나 눌러서 고르기</b><span>.risum · .risup · .json · .js … 여러 개면 한 버전으로 묶여요 · 파일 없이 만들어도 돼요</span></div>
      <div class="vlist" id="iList"></div>
      <div class="addtop">
        <div class="cv" id="iCv" style="background:${tint(Date.now() % 8)};width:120px;cursor:pointer" title="표지 고르기 (없어도 돼요)"></div>
        <div style="flex:1;min-width:0;display:flex;flex-direction:column;gap:14px">
          <div class="field">종류<div class="seg" id="iType"></div></div>
          <div class="row" style="flex-wrap:nowrap;gap:12px">
            <label class="field" style="flex:2">이름<input class="inp" id="iName" maxlength="200"></label>
            <label class="field" style="flex:1">만든 사람<input class="inp" id="iWho" placeholder="나"></label></div>
          <label class="field">버전 이름<input class="inp" id="iVer" maxlength="40" placeholder="예: v1.2 — 비워 두면 '첫 버전'"></label>
        </div>
      </div>
      <div><p class="legend">자료함 폴더<span>안 골라도 돼요</span></p><div class="ftiles" id="iFolders"></div></div>
    </div>
    <footer><span class="note">종류·폴더는 나중에 자료 페이지에서 바꿀 수 있어요</span><button class="btn" data-close>취소</button><button class="btn pri" id="iOk">자료함에 넣기</button></footer>`);
  const cvDraw = () => { $('#iCv', m).innerHTML = cov ? `<img src="${cov}" alt="">` : `<span class="ph pi">${ic(itIcon(itype || 'etc'), 44, 1.4)}</span>`; };
  const typeDraw = () => {
    $('#iType', m).innerHTML = Object.entries(ITYPE).map(([k, v]) => `<button type="button" class="pill" data-t="${k}" aria-pressed="${itype === k}">${h(v)}</button>`).join('');
    $$('#iType .pill', m).forEach(b => b.onclick = () => { itype = b.dataset.t; typeTouched = true; typeDraw(); cvDraw(); listDraw(); });
  };
  const fk = x => x.kind === 'etc' && KIND[itype] ? itype : x.kind;  // 그냥 파일로 읽힌 건 자료 종류를 따라감 (로어북 .json 등)
  const listDraw = () => {
    $('#iList', m).innerHTML = picked.map((x, i) => `<div class="vf"><span class="fi">${h(KIND_EXT[fk(x)] === 'FILE' ? (x.file.name.split('.').pop() || '').toUpperCase().slice(0, 5) : KIND_EXT[fk(x)])}</span>
      <div style="min-width:0"><b>${h(x.file.name)}</b><span class="meta">${KIND[fk(x)]} · ${size(x.file.size)}</span></div>
      <button class="ib" data-rm="${i}" aria-label="빼기">${ic('x', 16)}</button></div>`).join('');
    $$('[data-rm]', m).forEach(b => b.onclick = () => { picked.splice(+b.dataset.rm, 1); listDraw(); });
  };
  const add = async fs => {
    if (!fs.length) return;
    const got = await sortFiles(fs);
    for (const x of got) if (x.kind === 'card') { x.kind = 'etc'; x.card = null; }  // 자료함엔 봇 카드가 없음 (로어북 .json이 카드처럼 읽히기도 해서)
    picked = picked.concat(got); listDraw();

  dropZone(dz, add);
  $('#iCv', m).onclick = async () => { const [f] = await pick('image/*'); if (!f) return; cov = await shrink(f, 900); cvDraw(); };

    btn.disabled = true;
    try {
      const b = await api('POST', '/api/bots', {name, creator: $('#iWho', m).value.trim(), itype, folders: [...chosen], cover: cov || undefined});
      if (picked.length || ver) {
        const v = await api('POST', '/api/versions', {bot_id: b.id, name: ver || '첫 버전', current: true});
        if (picked.length) await uploadSorted(picked.map(x => ({...x, kind: fk(x)})), {bot: b.id, version: v.id});
      }
      m.close();
      await loadState();
      location.hash = `#/b/${b.id}`;
      toast(`${b.name}을(를) 자료함에 넣었어요`);
    } catch (e) { fail(e); btn.disabled = false; }
  };
}

// ---- 그림체: 그림 생성 프롬프트(작가·스타일 태그) + 견본 그림. 분류 칸 + 그림체 전용 폴더, 봇과 잇기(공식·어울림), 파일로 나눠 주기 ----
const SROLE = {official: '공식', mine: '어울림'};
const SETL = {model: '모델', sampler: '샘플러', steps: '스텝', scale: '가이던스', cfg_rescale: '리스케일', noise_schedule: '노이즈 스케줄', size: '크기', extra: '그 밖의 설정'};
document.addEventListener('click', e => { const a = e.target.closest('[data-sfgo]'); if (a) ss.set('bs-sfolder', a.dataset.sfgo); });
async function copyText(t, what = '복사했어요') {
  try { await navigator.clipboard.writeText(t); }
  catch (e) {  // http(같은 와이파이 주소 등)에서는 clipboard API가 막혀 있어서 옛 방식으로
    const ta = document.createElement('textarea'); ta.value = t; ta.style.cssText = 'position:fixed;opacity:0'; document.body.append(ta); ta.select();
    try { document.execCommand('copy'); } catch (er) { ta.remove(); return toast('복사하지 못했어요', true); }
    ta.remove();
  }
  toast(what);
}
// 그림 속 생성 정보: NAI(tEXt Comment JSON) · 스테이블 디퓨전 웹UI(parameters). 없으면 null
async function genMeta(file) {
  if (!/\.png$/i.test(file.name) && file.type !== 'image/png') return null;
  const buf = new Uint8Array(await file.arrayBuffer());
  if (buf[0] !== 0x89 || buf[1] !== 0x50) return null;
  const dv = new DataView(buf.buffer), dec = new TextDecoder(), t = {};
  for (let pos = 8; pos + 8 <= buf.length;) {
    const len = dv.getUint32(pos), type = String.fromCharCode(...buf.subarray(pos + 4, pos + 8));
    if (type === 'tEXt' || type === 'iTXt') {
      const d = buf.subarray(pos + 8, pos + 8 + len), z = d.indexOf(0), k = dec.decode(d.subarray(0, z));
      if (type === 'tEXt') t[k] = dec.decode(d.subarray(z + 1));
      else if (!d[z + 1]) { let q = d.indexOf(0, z + 3) + 1; q = d.indexOf(0, q) + 1; t[k] = dec.decode(d.subarray(q)); }  // 압축 안 한 iTXt만
    }
    if (type === 'IEND') break;
    pos += 12 + len;
  }
  if (t.Comment) {
    let c; try { c = JSON.parse(t.Comment); } catch (e) { return null; }
    const v4 = c.v4_prompt && c.v4_prompt.caption, n4 = c.v4_negative_prompt && c.v4_negative_prompt.caption;
    const str = v => v == null || v === '' ? '' : String(v);
    return {gen: 'NAI', prompt: (v4 && v4.base_caption) || c.prompt || t.Description || '', negative: (n4 && n4.base_caption) || c.uc || '',
      chars: v4 && Array.isArray(v4.char_captions) ? v4.char_captions.map((x, i) => ({prompt: x.char_caption || '', negative: (n4 && n4.char_captions && n4.char_captions[i] && n4.char_captions[i].char_caption) || ''})).filter(c => c.prompt || c.negative) : [],
      settings: {model: str(t.Source), sampler: str(c.sampler), steps: str(c.steps), scale: str(c.scale), cfg_rescale: str(c.cfg_rescale || ''),
        noise_schedule: str(c.noise_schedule), size: c.width && c.height ? `${c.width}×${c.height}` : ''}};
  }
  if (t.parameters) {
    const pr = t.parameters, ng = pr.indexOf('\nNegative prompt:'), st = pr.lastIndexOf('\nSteps:');
    return {gen: 'SD', prompt: pr.slice(0, ng >= 0 ? ng : st >= 0 ? st : pr.length).trim(), negative: ng >= 0 ? pr.slice(ng + 17, st > ng ? st : pr.length).trim() : '',
      settings: {extra: st >= 0 ? pr.slice(st + 1).trim().slice(0, 300) : ''}};
  }
  return null;
}

        ${(x.chars || []).map(charOf).map((c, i) => `${c.prompt ? `<h3 style="margin-top:18px">캐릭터 ${i + 1}<button class="ib" data-cpc="${i}" aria-label="캐릭터 ${i + 1} 복사" title="복사">${ic('copy', 16)}</button></h3><pre class="sprm">${h(c.prompt)}</pre>` : ''}
          ${c.negative ? `<h3 style="margin-top:${c.prompt ? 10 : 18}px;font-weight:600">캐릭터 ${i + 1} 네거티브<button class="ib" data-cpn="${i}" aria-label="캐릭터 ${i + 1} 네거티브 복사" title="복사">${ic('copy', 16)}</button></h3><pre class="sprm">${h(c.negative)}</pre>` : ''}`).join('')}
        ${x.negative ? `<h3 style="margin-top:18px">네거티브<button class="ib" data-cp="negative" aria-label="네거티브 복사" title="복사">${ic('copy', 16)}</button></h3><pre class="sprm">${h(x.negative)}</pre>` : ''}
        ${set.length ? `<div class="kv sset">${set.map(([k, v]) => `<div><b>${h(v)}</b><span>${h(SETL[k] || k)}</span></div>`).join('')}</div>` : ''}</div>
      <div class="box"><h3>견본 그림 <span class="meta" style="font-weight:500">${x.images.length}</span><button class="ib" id="syImg" aria-label="그림 더하기" title="그림 더하기">${ic('plus', 16)}</button></h3>
        ${x.images.length ? `<div class="simgs">${x.images.map((g, i) => `<div class="sim" data-g="${g.id}"><img src="/m/${h(g.image)}" alt="" loading="lazy" data-lb="${h(g.image)}">
          ${i === 0 ? '<span class="sgen">대표</span>' : ''}
          <div class="simb">${i ? `<button class="ib" data-front aria-label="대표로" title="대표 그림으로">${ic('star', 14)}</button>` : ''}${g.meta && g.meta.prompt ? `<button class="ib" data-gp aria-label="이 그림 프롬프트" title="이 그림의 프롬프트 복사">${ic('copy', 14)}</button>` : ''}<button class="ib" data-gdel aria-label="지우기" title="지우기">${ic('trash', 14)}</button></div></div>`).join('')}</div>`
          : '<p class="hint">견본 그림을 더해 두면 어떤 그림체인지 한눈에 보여요.</p>'}</div>
    </div><aside style="display:flex;flex-direction:column;gap:18px">
      <div class="box"><h3>${ic('link', 16)}이 그림체를 쓰는 봇<button class="ib" id="syBot" aria-label="봇 잇기" title="봇 잇기">${ic('plus', 16)}</button></h3>
        ${x.bots.length ? `<div class="sbl">${x.bots.map(b => `<div class="sbr"><a href="#/b/${b.id}" class="sbr">${b.cover ? `<img src="/m/${h(b.cover)}" alt="" loading="lazy">` : `<span class="sph">${h([...(b.name || '?')][0])}</span>`}<span class="sbn">${h(b.name)}</span></a>
          <span class="srole ${b.role}">${SROLE[b.role]}</span><button class="ib" data-unb="${b.id}" aria-label="잇기 풀기" title="잇기 풀기">${ic('x', 14)}</button></div>`).join('')}</div>`
          : '<p class="hint">이 그림체가 공식인 봇이나, 어울리는 봇을 이어 두세요.</p>'}</div>
      ${x.source || x.memo ? `<div class="box"><h3>메모</h3>${x.source ? `<p style="margin:0 0 8px"><a href="${h(x.source)}" target="_blank" rel="noopener noreferrer">출처 열기 ↗</a></p>` : ''}${x.memo ? `<div class="memo-pre" style="max-height:none;-webkit-mask-image:none">${h(x.memo)}</div>` : ''}</div>` : ''}
    </aside></div>
  </div>`;
  const reload = async d => { SY = d || await api('GET', `/api/styles/${x.id}`); drawStyle(); };
  $('#syBack').onclick = () => navStack.length > 1 ? history.back() : (location.hash = '#/styles');
  $('#syCopy').onclick = () => copyText(x.prompt, '프롬프트를 복사했어요');
  $$('[data-cp]').forEach(b => b.onclick = () => copyText(x[b.dataset.cp], b.dataset.cp === 'prompt' ? '프롬프트를 복사했어요' : '네거티브를 복사했어요'));
  $$('[data-cpc]').forEach(b => b.onclick = () => copyText(charOf(x.chars[+b.dataset.cpc]).prompt, `캐릭터 ${+b.dataset.cpc + 1} 프롬프트를 복사했어요`));
  $$('[data-cpn]').forEach(b => b.onclick = () => copyText(charOf(x.chars[+b.dataset.cpn]).negative, `캐릭터 ${+b.dataset.cpn + 1} 네거티브를 복사했어요`));
  $$('#syType .pill').forEach(b => b.onclick = async () => { try { await reload(await api('PUT', `/api/styles/${x.id}`, {stype: b.dataset.t})); loadState(); } catch (e) { fail(e); } });
  $('#syTyEdit').onclick = () => labelDialog('stypes', () => viewStyle(x.id));
  $('#syFolders').onclick = () => {
    const chosen = new Set(x.folders);
    const m = modal(`<header><h2>폴더 바꾸기</h2><span>${h(x.name)}</span>${xBtn}</header><div class="bd"><div class="ftiles" id="mf"></div></div>
      <footer><span class="note">여러 곳에 같이 넣을 수 있어요</span><button class="btn" data-close>취소</button><button class="btn pri" data-ok>저장</button></footer>`);
    folderTiles($('#mf', m), chosen, 'style');
    $('[data-ok]', m).onclick = async () => { try { await reload(await api('PUT', `/api/styles/${x.id}`, {folders: [...chosen]})); m.close(); loadState(); } catch (e) { fail(e); } };
  };
  $('#syEdit').onclick = () => {
    let stype = x.stype;
    const m = modal(`<header><h2>그림체 고치기</h2>${xBtn}</header><div class="bd">${styleForm(x)}</div>
      <footer><span class="note"></span><button class="btn" data-close>취소</button><button class="btn pri" data-ok>저장</button></footer>`);
    $$('#sfType .pill', m).forEach(b => b.onclick = () => { stype = b.dataset.t; $$('#sfType .pill', m).forEach(y => y.setAttribute('aria-pressed', y === b)); });
    charsUI(m, x.chars);
    $('[data-ok]', m).onclick = async () => {
      const v = readStyleForm(m, stype);
      if (!v.name) return toast('이름을 적어 주세요', true);
      try { await reload(await api('PUT', `/api/styles/${x.id}`, v)); m.close(); loadState(); toast('저장했어요'); } catch (e) { fail(e); }
    };
  };
  $('#syDel').onclick = async () => {
    if (!await confirmBox('그림체 지우기', `<b>${h(x.name)}</b>을(를) 지울까요? 견본 그림 ${x.images.length}장이 함께 지워지고, 이은 봇에서도 빠져요. 되돌릴 수 없어요.`)) return;
    try { await api('DELETE', `/api/styles/${x.id}`); SY = null; await loadState(); location.hash = '#/styles'; toast('지웠어요'); } catch (e) { fail(e); }
  };
  $('#syImg').onclick = async () => {
    const fs = await pick('image/*', true);
    if (!fs.length) return;
    try {
      const images = await Promise.all(fs.map(async f => ({data: await imgData(f), meta: await genMeta(f).catch(() => null) || {}})));
      await reload(await api('POST', `/api/styles/${x.id}/images`, {images})); toast(`${fs.length}장 더했어요`);
    } catch (e) { fail(e); }
  };
  $$('[data-lb]').forEach((im, i) => im.onclick = () => styleViewer(i));
  $$('.sim[data-g]').forEach(el => {
    const g = x.images.find(y => y.id === +el.dataset.g);
    const f = $('[data-front]', el), gp = $('[data-gp]', el);
    if (f) f.onclick = async () => { try { await reload(await api('PUT', `/api/style_images/${g.id}`, {front: true})); } catch (e) { fail(e); } };
    if (gp) gp.onclick = () => copyText(g.meta.prompt, '이 그림의 프롬프트를 복사했어요');
    $('[data-gdel]', el).onclick = async () => {
      if (!await confirmBox('그림 지우기', '이 견본 그림을 지울까요?')) return;
      try { await reload(await api('DELETE', `/api/style_images/${g.id}`)); } catch (e) { fail(e); }
    };
  });
  $('#syBot').onclick = async () => {
    let bots; try { bots = await api('GET', '/api/bots'); } catch (e) { return fail(e); }
    const have = new Set(x.bots.map(b => b.id));
    pickDialog({title: '봇 잇기', sub: x.name, empty: '서재에 봇이 없어요.',
      items: bots.filter(b => !have.has(b.id)).sort((a, b) => a.name.localeCompare(b.name, 'ko')).map(b => ({id: b.id, name: b.name, cover: b.cover, sub: b.creator})),
      onPick: async (bid, role) => reload(await api('POST', `/api/styles/${x.id}/bots`, {bot_id: bid, role}))});
  };
  $$('[data-unb]').forEach(b => b.onclick = async () => { try { await reload(await api('DELETE', `/api/styles/${x.id}/bots/${b.dataset.unb}`)); } catch (e) { fail(e); } });
}

// 견본 그림 크게 보기 + 옆에 그 그림의 생성 정보 (←/→로 넘기기, Esc 닫기)
function styleViewer(start) {
  let i = start;
  const el = document.createElement('div');
  el.className = 'sview'; el.setAttribute('role', 'dialog'); el.setAttribute('aria-modal', 'true');
  document.body.append(el);
  const key = e => { if (e.key === 'Escape') close(); else if (e.key === 'ArrowRight') go(1); else if (e.key === 'ArrowLeft') go(-1); };
  const close = () => { el.remove(); document.removeEventListener('keydown', key); };
  const go = d => { const n = SY.images.length; if (n > 1) { i = (i + d + n) % n; draw(); } };
  document.addEventListener('keydown', key);
  const draw = () => {
    const imgs = SY.images, g = imgs[i], mt = g.meta || {}, texts = [];
    const set = Object.entries(mt.settings || {}).filter(([, v]) => v), chars = (mt.chars || []).map(charOf).filter(c => c.prompt || c.negative);
    const sec = (title, text) => { texts.push(text); return `<div><div class="svh">${title}<button class="ib" data-copy="${texts.length - 1}" aria-label="${title} 복사" title="복사">${ic('copy', 15)}</button></div><pre class="sprm">${h(text)}</pre></div>`; };
    const body = [mt.prompt ? sec('프롬프트', mt.prompt) : '',
      ...chars.map((c, n) => (c.prompt ? sec(`캐릭터 ${n + 1}`, c.prompt) : '') + (c.negative ? sec(`캐릭터 ${n + 1} 네거티브`, c.negative) : '')),
      mt.negative ? sec('네거티브', mt.negative) : '',
      set.length ? `<div class="kv sset" style="margin:0">${set.map(([k, v]) => `<div><b>${h(v)}</b><span>${h(SETL[k] || k)}</span></div>`).join('')}</div>` : ''].join('');
    el.innerHTML = `<div class="svimg"><img src="/m/${h(g.image)}" alt="">
        ${imgs.length > 1 ? `<button class="svnav prev" data-go="-1" aria-label="앞 그림">${ic('back', 22)}</button><button class="svnav next" data-go="1" aria-label="다음 그림">${ic('back', 22)}</button>` : ''}</div>
      <aside class="svside">
        <div class="svtop"><b>견본 그림 ${i + 1} / ${imgs.length}</b>${mt.gen ? `<span class="srole">${h(mt.gen)}</span>` : ''}<button class="ib" data-x aria-label="닫기">${ic('x', 20)}</button></div>
        ${body || '<p class="hint" style="margin:0">이 그림에는 생성 정보가 없어요. NAI·웹UI에서 바로 저장한 PNG라야 읽을 수 있어요.</p>'}
        <div class="row" style="margin-top:auto;padding-top:6px">
          <a class="btn sm ghost" href="/m/${h(g.image)}" download>${ic('dl', 15)}원본 받기</a>
          ${i ? `<button class="btn sm ghost" data-front>${ic('star', 15)}대표 그림으로</button>` : '<span class="meta">대표 그림이에요</span>'}
        </div>
      </aside>`;
    $('[data-x]', el).onclick = close;
    $('.svimg', el).onclick = e => { if (e.target === e.currentTarget) close(); };  // 그림 밖 빈 곳을 누르면 닫기
    $$('[data-go]', el).forEach(b => b.onclick = () => go(+b.dataset.go));
    $$('[data-copy]', el).forEach(b => b.onclick = () => copyText(texts[+b.dataset.copy]));
    const f = $('[data-front]', el);
    if (f) f.onclick = async () => {
      try { SY = await api('PUT', `/api/style_images/${g.id}`, {front: true}); i = 0; drawStyle(); draw(); toast('대표 그림으로 바꿨어요'); } catch (e) { fail(e); }
    };
  };
  draw();
}

// ---- 파일 모아 보기 (봇에 딸린 파일 · 예전 칸 파일) ----
async function viewShelf(sid) {
  if (!sid) return viewItems();
  const all = await api('GET', '/api/files');
  const shelves = S.state.shelves;
  const cur = sid === 'bots' ? 'bots' : sid === 'loose' ? null : +sid || null;
  const loose = all.filter(f => !f.bot_id);
  const list = cur === 'bots' ? all.filter(f => f.bot_id) : cur ? loose.filter(f => f.shelf_id === cur) : loose;
  const sh = typeof cur === 'number' ? shelves.find(s => s.id === cur) : null;
  $('#view').innerHTML = `<div class="wrap">
    <a class="backbtn" href="#/shelf">${ic('back', 16)}자료함</a>
    <div class="toolbar" style="margin-bottom:22px"><h1 class="disp" style="margin:0;font-size:34px">파일 모아 보기</h1>
      <span class="meta" style="font-size:14px">봇에 딸린 파일, 예전에 칸에 넣어 둔 파일</span></div>
    <div class="shelves">
      <a class="shelf" href="#/shelf/loose" data-rep ${cur === null ? 'aria-current="page"' : ''}><b>전체</b><span>${loose.length}개</span></a>
      ${shelves.map(s => `<a class="shelf" href="#/shelf/${s.id}" data-rep ${cur === s.id ? 'aria-current="page"' : ''}><b>${h(s.name)}</b><span>${s.count}개</span></a>`).join('')}
      <a class="shelf" href="#/shelf/bots" data-rep ${cur === 'bots' ? 'aria-current="page"' : ''}><b>봇에 딸린 자료</b><span>${all.length - loose.length}개 · 모아 보기</span></a>
      <button class="shelf add" id="sNew">${ic('plus', 16)}새 칸</button>
    </div>
    ${sh ? `<div class="toolbar"><h2>${h(sh.name)}</h2><button class="btn sm ghost" id="sRen">${ic('edit', 15)}이름 바꾸기</button><button class="btn sm ghost danger" id="sDel">${ic('trash', 15)}칸 지우기</button></div>` : ''}
    ${cur === 'bots' ? '' : `<div class="drop" id="sDrop" tabindex="0" role="button" style="margin-bottom:18px"><b>파일 끌어다 놓기 / 눌러서 고르기</b><span>${sh ? `${h(sh.name)} 칸에 넣어요` : '칸 없이 넣어요 — 나중에 옮길 수 있어요'}</span></div>`}
    <div class="box"><div class="files" id="sFiles">${list.map(f => fileRow(f, {bot: cur === 'bots'})).join('') || '<p class="hint">비어 있어요.</p>'}</div></div>
  </div>`;
  const after = () => loadState().then(() => viewShelf(sid));
  bindFiles($('#sFiles'), list, after);
  if (cur === 'bots') $$('#sFiles .fr').forEach(r => { const f = list.find(x => x.id === +r.dataset.id); if (f) { const a = document.createElement('a'); a.className = 'btn sm ghost'; a.href = `#/b/${f.bot_id}/files`; a.textContent = '봇으로'; $('.acts', r).prepend(a); } });
  $('#sNew').onclick = () => shelfDialog();
  if (sh) {
    $('#sRen').onclick = () => shelfDialog(sh);
    $('#sDel').onclick = async () => {
      if (!await confirmBox('칸 지우기', `<b>${h(sh.name)}</b> 칸을 지울까요? 안의 파일 ${sh.count}개는 '칸 없음'으로 남아요.`)) return;
      try { await api('DELETE', `/api/shelves/${sh.id}`); await loadState(); location.hash = '#/shelf/loose'; } catch (e) { fail(e); }
    };
  }
  const dz = $('#sDrop');
  if (dz) {
    const go = fs => fs.length && uploadFiles(fs, sh ? {shelf: sh.id} : {}, () => viewShelf(sid));
    dz.onclick = async () => go(await pick('', true));
    dropZone(dz, go);
  }
}
function shelfDialog(s) {
  const m = modal(`<header><h2>${s ? '칸 이름 바꾸기' : '새 칸'}</h2>${xBtn}</header>
    <div class="bd"><label class="field">이름<input class="inp" id="sn" maxlength="20" value="${h(s ? s.name : '')}" placeholder="예: 공용 모듈"></label></div>
    <footer><span class="note"></span><button class="btn" data-close>취소</button><button class="btn pri" data-ok>${s ? '저장' : '만들기'}</button></footer>`, 'narrow');
  const ok = async () => {
    try {
      const name = $('#sn', m).value.trim();
      const d = s ? await api('PUT', `/api/shelves/${s.id}`, {name}) : await api('POST', '/api/shelves', {name});
      S.state = d.state; renderSide(); m.close();
      location.hash = `#/shelf/${s ? s.id : d.id}`; if (s) route();
    } catch (e) { fail(e); }
  };
  $('[data-ok]', m).onclick = ok;
  $('#sn', m).onkeydown = e => { if (e.key === 'Enter' && !e.isComposing) ok(); };
}

// ---- 길 찾기 ----
document.addEventListener('click', e => {  // 같은 화면 안의 탭 이동은 방문 기록을 쌓지 않음
  const a = e.target.closest('a[data-rep]');
  if (!a || e.ctrlKey || e.metaKey || e.shiftKey) return;
  e.preventDefault();
  replaceHash(a.getAttribute('href'));
});
let lastPath = '';
async function route() {
  const r = (location.hash.slice(1) || '/').split('/').filter(Boolean);
  document.body.classList.toggle('entry', !r.length);
  renderSide();
  const path = r.slice(0, 2).join('/');
  if (path !== lastPath) window.scrollTo(0, 0);
  lastPath = path;
  try {
    if (!r.length) return await viewMain();
    if (r[0] === 'all') return await viewHome();
    if (r[0] === 'f' && r[1]) return await viewHome(+r[1]);
    if (r[0] === 'b' && r[1]) return await viewBot(+r[1], r[2]);
    if (r[0] === 'c' && r[1]) return await viewChat(+r[1]);
    if (r[0] === 'chats') return await viewChats();
    if (r[0] === 'shelf') return await viewShelf(r[1]);
    if (r[0] === 'styles') return await viewStyles();
    if (r[0] === 's' && r[1]) return await viewStyle(+r[1]);
    replaceHash('#/');
  } catch (e) {
    $('#view').innerHTML = `<div class="wrap"><div class="empty"><h3>못 불러왔어요</h3><p>${h(e.message)}</p><a class="btn" href="#/">서재로</a></div></div>`;
  }
}
window.addEventListener('hashchange', route);
loadState().then(route).catch(e => { if (e.login) return; $('#view').innerHTML = `<div class="wrap"><div class="empty"><h3>서버에 연결하지 못했어요</h3><p>${h(e.message)}</p></div></div>`; });
</script>
</body>
</html>
